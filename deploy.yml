name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete
        env:
          AWS_S3_BUCKET: your-bucket-name
          AWS_ACCESS_KEY_ID: ${{ secrets.AKIAU466IVTM5KXXK3VV }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.M9DEEHu/KOeFBbuwY5/afUNnInac56wGZu8IFDc2 }}
          AWS_REGION: your-region
          SOURCE_DIR: "."
